<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API de Geolocalização</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050507;
      font-family: sans-serif;
    }

    video {
      width: 100%;
      max-width: 500px mim;
      height: 400px;
      border-radius: 15px;
    }

    audio {
      width: 300px;
      height: 50px;
    }

    .fundo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      gap: 10px;
    }

    .geolocalizacao {
      width: 100%;
      min-width: 450px;
      padding: 30px;
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid #2d2e33;
    }

    h1 {
      margin: 0;
      font-size: 40px;
      font-family: sans-serif;
      text-align: center;
      color: #3F2973;
    }

    .botao {
      font-family: sans-serif;
      font-size: 12px;
      padding: 10px 22px;
      border-radius: 5px;
      text-align: center;
      border: none;
      background-color: #2D308A;
      color: #dedede;
    }

    p {
      color: #dedede;
    }
  </style>
</head>

<body>

  <div class="fundo">
    <video src="Earth.mp4" controls loop autoplay muted></video>
    <audio src="mídias/audio.mp3" controls loop autoplay></audio>
  </div>

  <div class="geolocalizacao">
    <h1>Geolocalização</h1>
    <button class="botao" onclick="getLocation()">Obter localização</button>
    <p id="status"></p>
    <p id="location"></p>
  </div>

  <script>
    function getLocation() {
      const status = document.getElementById("status");
      const location = document.getElementById("location");

      if (!navigator.geolocation) {
        status.textContent = "Geolocalização não é suportada pelo navegador.";
        return;
      }

      status.textContent = "Buscando localização...";

      navigator.geolocation.getCurrentPosition(
        function (position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          status.textContent = "Localização encontrada";
          // CORRIGIDO: Sintaxe da string organizada
          location.textContent = `Latitude: ${latitude}, 
          Longitude: ${longitude}`;
        },
        function (error) {
          status.textContent = "Não foi possível obter a localização.";
          location.textContent = `Código do erro: ${error.code} - ${error.message}`;
        }
      );
    }
  </script>

</body>

</html>
